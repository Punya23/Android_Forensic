#!/usr/sbin/nft -f
#
# Applied only in --network-mode lan (via set-network-mode.sh). Default-deny
# inbound; the single hole is the SNAGR port (5057/tcp) from the subnet the
# investigator's laptop is actually on. Nothing else is exposed.
#
# EDIT the subnet below before relying on this — 192.168.1.0/24 is a
# placeholder, not your network.
#
# This ruleset does not open any outbound path — the deliberate one-off
# email step (deploy/send-report-email.sh) brings its own radio up and back
# down again around a single send; it isn't gated by this file.

flush ruleset

table inet snagr {
  chain input {
    type filter hook input priority 0; policy drop;

    iif lo accept
    ct state established,related accept
    ct state invalid drop

    # SNAGR dashboard + API. Change this subnet to match your setup.
    ip saddr 192.168.1.0/24 tcp dport 5057 accept

    icmp type echo-request accept
    icmpv6 type { echo-request, nd-neighbor-solicit, nd-neighbor-advert } accept
  }

  chain forward {
    type filter hook forward priority 0; policy drop;
  }

  chain output {
    type filter hook output priority 0; policy accept;
  }
}
