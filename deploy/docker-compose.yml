version: '3.8'

services:
  api_gateway:
    image: android_forensic_gateway:latest
    build: 
      context: ../
      dockerfile: deploy/Dockerfile.gateway
    ports:
      - "8080:8080"
    environment:
      - ENV=production
    restart: always

  graphql_server:
    image: android_forensic_graphql:latest
    ports:
      - "4000:4000"
    depends_on:
      - api_gateway

  webhook_worker:
    image: android_forensic_webhook:latest
    environment:
      - REDIS_URL=redis://redis:6379/0

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
