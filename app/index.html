<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SNAGR — Forensic Preview</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <script>
      // Set the theme class before first paint — stored choice, else OS preference —
      // so there's no flash of the wrong theme while React boots. Kept in sync with
      // src/lib/theme.ts (duplicated, not imported: this must run before any module
      // loads).
      (function () {
        try {
          var stored = localStorage.getItem("snagr-theme");
          var dark = stored ? stored === "dark" : true;
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
