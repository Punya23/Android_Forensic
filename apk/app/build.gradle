// SNAGR Collector — Tier-1 helper APK module build file.
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Release signing key, if one has been provisioned. `apk/keystore.properties` is
// git-ignored and never committed — see `apk/keystore.properties.example`. Its absence
// is expected on a fresh checkout and is not an error: `assembleRelease` falls back to
// the debug key below so it still produces a *signed*, installable APK rather than
// silently shipping unsigned output.
def keystorePropsFile = rootProject.file('keystore.properties')
def hasReleaseKeystore = keystorePropsFile.exists()
def keystoreProps = new Properties()
if (hasReleaseKeystore) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace 'io.erakshak.collector'
    compileSdk 34

    defaultConfig {
        applicationId 'io.erakshak.collector'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '0.2.0'
    }

    signingConfigs {
        release {
            if (hasReleaseKeystore) {
                storeFile rootProject.file(keystoreProps.getProperty('storeFile'))
                storePassword keystoreProps.getProperty('storePassword')
                keyAlias keystoreProps.getProperty('keyAlias')
                keyPassword keystoreProps.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        debug {
            // Debug build is fine for sideloading in a lab/field context.
            debuggable true
        }
        release {
            minifyEnabled false
            // Real release key when `keystore.properties` is provisioned; otherwise the
            // debug key, so the output is always signed — never the previous silent
            // unsigned APK.
            signingConfig hasReleaseKeystore ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    sourceSets {
        main {
            manifest.srcFile 'src/main/AndroidManifest.xml'
            java.srcDirs = ['src/main/java']
            res.srcDirs = ['src/main/res']
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    // json.org is bundled in the Android platform; no extra deps needed.
}
